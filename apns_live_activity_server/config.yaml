name: APNs Live Activity Server
slug: apns_live_activity_server
version: "1.2.4"
description: APNs Push-to-Start and Live Activity API
arch:
  - amd64
startup: services
boot: auto
init: false
ports:
  8000/tcp: 8000
map:
  - type: app_config
    read_only: true
options:
  app_attest_enabled: true
  app_attest_environment: development
  app_attest_app_id: ""
  app_attest_challenge_ttl_seconds: 300
  apns_timeout_seconds: 10
  log_level: INFO
  additional_bundle_ids: ""
schema:
  app_attest_enabled: bool
  app_attest_environment: list(development|production)
  app_attest_app_id: str?
  app_attest_challenge_ttl_seconds: int(60,900)
  apns_team_id: str(10,10)
  apns_key_id: str(10,10)
  apns_bundle_id: str(1,)
  additional_bundle_ids: str
  api_key: password(32,)
  apns_timeout_seconds: int(1,60)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
